# When installind addtional plugins or extenstions dont forget to put them into
#requirement file
# pip freeze > requirements.txt

site_name: "" #Netomat SRL
site_url: https://www.netomat.io/
theme:
  name: material
  logo: assets/netomat_MainLogo.png
  
nav:
  - Home: index.md
  - Services:
      - Overview: services/index.md
      - Architecture & Design: services/architecture_design.md
      - Engineering: services/engineering.md
      - Testing: services/testing.md
  - About: 
    - About me: about/me/about_me.md
    - Company Details: about/imprint.md
    # - Skills: about/me/skills.md
    # - Projects: about/me/projects.md
  - Blog:
      - Blog: blog/index.md
      #- Archive: blog/archive.md
  

plugins:
  - search
  - encriptmail:
       placeholderAt: (Q)
       placeholderDot: (P)
  - git-revision-date-localized:
      enable_creation_date: true
  - blog

copyright: >
  Copyright &copy; 2024 -> Netomat LLC

# extra:
  # generator: false

extra_css:
  - styles/extra.css

markdown_extensions:
  - attr_list